        <style>
            :root{--mist-top:#DCE8E0;--mist-mid:#BFD6CB;--green-deep:#2C5648;--green-mid:#3C6859;--paper:#F5F0E2;--paper-soft:#FBF7EC;--ochre:#8C4E2A;--ink:#21302A;--muted:#485A50;--line:#CFDCCF}
            *{box-sizing:border-box}html,body{margin:0}
            body{font-family:'DM Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--mist-top) 0,var(--mist-mid) 240px,var(--paper) 560px);min-height:100vh}
            .hidden,[hidden]{display:none!important}
            .staticrypt-page{max-width:400px;margin:0 auto;padding:12vh 16px 40px}
            .staticrypt-form{background:var(--paper-soft);border:1px solid var(--line);border-radius:16px;padding:26px 22px}
            .wm{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;letter-spacing:.16em;color:var(--green-deep);font-size:18px}
            .staticrypt-title{font-family:'Noto Serif SC','Songti SC',serif;font-weight:600;font-size:24px;color:var(--green-deep);margin:10px 0 6px}
            .itc-instr{font-size:14px;color:var(--muted);margin:0 0 16px;line-height:1.6}
            .staticrypt-password-container{position:relative}
            #staticrypt-password{width:100%;font-size:16px;padding:12px 44px 12px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
            #staticrypt-password:focus{outline:2px solid var(--mist-mid);border-color:var(--green-mid)}
            .staticrypt-toggle-password-visibility{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:20px;opacity:.45;cursor:pointer}
            .staticrypt-remember{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:12px 0 4px}
            .staticrypt-remember input{accent-color:var(--green-deep)}
            .staticrypt-decrypt-button{width:100%;margin-top:12px;border:0;border-radius:999px;padding:12px;font-size:16px;font-weight:500;background:var(--green-deep);color:#fff;cursor:pointer}
            .staticrypt-decrypt-button:hover{background:var(--green-mid)}
            #itc-error{margin-top:10px;font-size:14px;color:var(--ochre)}
            .itc-foot{text-align:center;font-size:12px;color:var(--muted);margin-top:18px}
            .staticrypt-spinner-container{height:100vh;display:flex;align-items:center;justify-content:center}
            .staticrypt-spinner{width:28px;height:28px;border:3px solid var(--mist-mid);border-top-color:var(--green-deep);border-radius:50%;animation:spin 1s linear infinite}
            @keyframes spin{to{transform:rotate(360deg)}}
        </style>
    </head>

        <script>

                staticryptConfig = /*[|staticrypt_config|]*/ 0;

                rememberExpirationKey: "itc_staticrypt_expiration",
                rememberPassphraseKey: "itc_staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            // init the staticrypt engine
            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            // try to automatically decrypt on load if there is a saved password
            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

                // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been
                // replaced, no need to do anything
                if (!isSuccessful) {
                    // hide loading screen
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();

                    // show the remember me checkbox
                    if (isRememberEnabled) {
                        document.getElementById("staticrypt-remember-label").classList.remove("hidden");
                    }

            const imgSrcEyeOpened =

                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {

                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;

            // handle password form submission

                const password = document.getElementById("staticrypt-password").value,

                // The class code also unlocks the AI coach: keep it so students type it only once.
